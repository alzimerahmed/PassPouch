name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint (if missing)
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Run SwiftLint (repo root)
        run: swiftlint

  build-and-test:
    name: Build & Tests (unit + UI smoke)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -workspace KeePassium.xcworkspace
          -scheme KeePassium

      - name: Build and run tests (unit + UI smoke)
        run: >
          set -o pipefail &&
          xcodebuild
          -workspace KeePassium.xcworkspace
          -scheme KeePassium
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -configuration Debug
          -enableCodeCoverage YES
          -resultBundlePath TestResults.xcresult
          -only-testing:KeePassiumTests
          -only-testing:KeePassiumUITests
          build test

      - name: Extract coverage report
        if: always()
        run: |
          xcrun xccov view --report TestResults.xcresult > coverage-report.txt || true
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > coverage-summary.json || true
          head -50 coverage-report.txt

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults.xcresult
            coverage-report.txt
            coverage-summary.json
          retention-days: 7
          if-no-files-found: warn
