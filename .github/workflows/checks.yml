name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint (if missing)
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Run SwiftLint (repo root)
        run: swiftlint

  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -workspace KeePassium.xcworkspace
          -scheme KeePassium

      - name: Build and run unit tests
        run: >
          set -o pipefail &&
          xcodebuild
          -workspace KeePassium.xcworkspace
          -scheme KeePassium
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -configuration Debug
          -only-testing:KeePassiumTests
          CODE_SIGNING_ALLOWED=NO
          build test

      - name: Build KeePassiumLib framework
        run: >
          set -o pipefail &&
          xcodebuild
          -workspace KeePassium.xcworkspace
          -scheme KeePassiumLib
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
